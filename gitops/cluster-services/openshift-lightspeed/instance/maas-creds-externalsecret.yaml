apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        apitoken: "{{ .apitoken | toString }}"
        OPENAI_API_KEY: "{{ .apitoken | toString }}"
        ANTHROPIC_AUTH_TOKEN: "{{ .apitoken | toString }}"
        ANTHROPIC_API_KEY: "placeholder"
    creationPolicy: Owner
  data:
    - secretKey: apitoken
      remoteRef:
        key: MAAS_LIGHTSPEED_TOKEN