apiVersion: registry.apicur.io/v1
kind: ApicurioRegistry3
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: apicurio-registry
spec:
  app:
    ingress:
      host: apicurio-registry.apps.prime.pitt.ca
      annotations:
        route.openshift.io/termination: edge
  ui:
    ingress:
      host: apicurio-registry-ui.apps.prime.pitt.ca
      annotations:
        route.openshift.io/termination: edge
    env:
      - name: REGISTRY_API_URL
        value: "https://apicurio-registry-app-apicurio-registry.apps.prime.pitt.ca/apis/registry/v3"



