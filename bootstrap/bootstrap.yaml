---
- name: Bootstrap Single Node OpenShift Cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig_path: "~/.kube/prime-kubeconfig"
    repo_root: "{{ playbook_dir }}/.."

  tasks:
    # --- Item 1: Doppler Secret Setup ---
    - name: Apply Doppler external secret resources
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition: "{{ lookup('kubernetes.core.kustomize', dir=repo_root + '/bootstrap/init/external-secrets-operator') }}"
        state: present

    # --- Item 2: OpenShift GitOps Operator ---
    - name: Ensure GitOps operator namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: Namespace
        name: openshift-gitops-operator
        state: present

    - name: Create GitOps OperatorGroup
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-gitops-operator-group
            namespace: openshift-gitops-operator
          spec:
            upgradeStrategy: Default

    - name: Create GitOps Subscription (Manual Approval)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-gitops-operator
            namespace: openshift-gitops-operator
          spec:
            channel: gitops-1.21
            name: openshift-gitops-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Manual

    - name: Wait for GitOps InstallPlan to be generated
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: openshift-gitops-operator
      register: gitops_install_plans
      failed_when: false
      until: (gitops_install_plans.resources | default([])) | length > 0
      retries: 30
      delay: 10

    - name: Approve GitOps InstallPlan
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: InstallPlan
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: openshift-gitops-operator
          spec:
            approved: true
      loop: "{{ gitops_install_plans.resources | default([]) }}"
      when: not (item.spec.approved | default(false))

    - name: Wait for ArgoCD CRD to be established
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: argocds.argoproj.io
      register: argocd_crd
      failed_when: false
      until: (argocd_crd.resources | default([])) | length > 0
      retries: 30
      delay: 10

    - name: Wait for default ArgoCD instance in openshift-gitops namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: argoproj.io/v1alpha1
        kind: ArgoCD
        namespace: openshift-gitops
        name: openshift-gitops
      register: argocd_instance
      failed_when: false
      until: (argocd_instance.resources | default([])) | length > 0
      retries: 40
      delay: 10

    # --- Item 3: LVM Storage Operator ---
    - name: Ensure LVM Storage operator namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openshift-lvm-storage
            labels:
              openshift.io/cluster-monitoring: "true"
        state: present

    - name: Create LVM Storage OperatorGroup
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-lvm-storage-operator-group
            namespace: openshift-lvm-storage
          spec:
            targetNamespaces:
              - openshift-lvm-storage

    - name: Create LVM Storage Subscription (Manual Approval)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: lvms-operator
            namespace: openshift-lvm-storage
          spec:
            channel: stable-4.22
            name: lvms-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Manual

    - name: Wait for LVM Storage InstallPlan to be generated
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: openshift-lvm-storage
      register: lvm_install_plans
      failed_when: false
      until: (lvm_install_plans.resources | default([])) | length > 0
      retries: 30
      delay: 10

    - name: Approve LVM Storage InstallPlan
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: InstallPlan
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: openshift-lvm-storage
          spec:
            approved: true
      loop: "{{ lvm_install_plans.resources | default([]) }}"
      when: not (item.spec.approved | default(false))

    - name: Wait for LVMCluster CRD to be established
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: lvmclusters.lvm.topolvm.io
      register: lvmcluster_crd
      failed_when: false
      until: (lvmcluster_crd.resources | default([])) | length > 0
      retries: 30
      delay: 10

    - name: Create default LVMCluster instance
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: lvm.topolvm.io/v1alpha1
          kind: LVMCluster
          metadata:
            name: default-lvmcluster
            namespace: openshift-lvm-storage
          spec:
            storage:
              deviceClasses:
                - fstype: xfs
                  default: true
                  thinPoolConfig:
                    chunkSizeCalculationPolicy: Static
                    metadataSizeCalculationPolicy: Host
                    sizePercent: 90
                    name: thin-pool-1
                    overprovisionRatio: 10
                  name: vg1
        state: present

    # --- Item 4: Multi-Cluster Engine Operator ---
    - name: Ensure MCE namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: Namespace
        name: multicluster-engine
        state: present

    - name: Create MCE OperatorGroup
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: multicluster-engine-operator-group
            namespace: multicluster-engine
          spec:
            targetNamespaces:
              - multicluster-engine

    - name: Create MCE Subscription (Manual Approval)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: multicluster-engine
            namespace: multicluster-engine
          spec:
            channel: stable-2.17
            name: multicluster-engine
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Manual

    - name: Wait for MCE InstallPlan to be generated
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: multicluster-engine
      register: mce_install_plans
      failed_when: false
      until: (mce_install_plans.resources | default([])) | length > 0
      retries: 30
      delay: 10

    - name: Approve MCE InstallPlan
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: InstallPlan
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: multicluster-engine
          spec:
            approved: true
      loop: "{{ mce_install_plans.resources | default([]) }}"
      when: not (item.spec.approved | default(false))

    - name: Wait for MCE CRD to be established
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: multiclusterengines.multicluster.openshift.io
      register: mce_crd
      failed_when: false
      until: (mce_crd.resources | default([])) | length > 0
      retries: 30
      delay: 10

    # --- Item 5: RHACM Operator ---
    - name: Ensure RHACM namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: Namespace
        name: open-cluster-management
        state: present

    - name: Create RHACM OperatorGroup
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: open-cluster-management-operator-group
            namespace: open-cluster-management
          spec:
            targetNamespaces:
              - open-cluster-management

    - name: Create RHACM Subscription (Manual Approval)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: advanced-cluster-management
            namespace: open-cluster-management
          spec:
            channel: release-2.17
            name: advanced-cluster-management
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Manual

    - name: Wait for RHACM InstallPlan to be generated
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: open-cluster-management
      register: rhacm_install_plans
      failed_when: false
      until: (rhacm_install_plans.resources | default([])) | length > 0
      retries: 30
      delay: 10

    - name: Approve RHACM InstallPlan
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: InstallPlan
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: open-cluster-management
          spec:
            approved: true
      loop: "{{ rhacm_install_plans.resources | default([]) }}"
      when: not (item.spec.approved | default(false))

    - name: Wait for RHACM MultiClusterHub CRD to be established
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: multiclusterhubs.operator.open-cluster-management.io
      register: rhacm_crd
      failed_when: false
      until: (rhacm_crd.resources | default([])) | length > 0
      retries: 30
      delay: 10

    # --- Item 6: Post-Install Configuration ---
    - name: Apply GitOps ClusterRoleBinding via Kustomize
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition: "{{ lookup('kubernetes.core.kustomize', dir=repo_root + '/bootstrap/init/openshift-gitops') }}"
        state: present

    # --- Item 7: GitOps Readiness & Root App Deployment ---
    - name: Wait for OpenShift GitOps Server deployment to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        namespace: openshift-gitops
        name: openshift-gitops-server
      register: gitops_server_deployment
      failed_when: false
      until:
        - (gitops_server_deployment.resources | default([])) | length > 0
        - (gitops_server_deployment.resources[0].status.readyReplicas | default(0)) > 0
      retries: 30
      delay: 10

    - name: Wait for ArgoCD instance status to be Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: argoproj.io/v1alpha1
        kind: ArgoCD
        namespace: openshift-gitops
        name: openshift-gitops
      register: argocd_instance_health
      failed_when: false
      until:
        - (argocd_instance_health.resources | default([])) | length > 0
        - argocd_instance_health.resources[0].status.phase | default('') == 'Available'
      retries: 30
      delay: 10

    - name: Apply Root ArgoCD Application via Kustomize
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition: "{{ lookup('kubernetes.core.kustomize', dir=repo_root + '/gitops/argocd/clusters/prime/bootstrap-rhacm') }}"
        state: present